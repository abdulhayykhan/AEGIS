name: AEGIS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Safeguard Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff Lint
      run: |
        ruff check .

    - name: Run Mypy Type Checks
      run: |
        mypy src tests

    - name: Run Unit Tests
      run: |
        pytest tests/unit

    - name: Run Property-Based Invariant Tests
      run: |
        pytest tests/property

    - name: Run Contract Tests
      run: |
        pytest tests/contract

    - name: Run Planted-Bug Mutation Tests
      run: |
        pytest tests/planted_bugs
